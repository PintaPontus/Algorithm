<mat-form-field class="console-field">
  <textarea matInput [value]="text() ?? output()" readonly></textarea>
  <div class="actions-container">
    <button
      matIconButton
      matTooltip="Copia testo"
      (click)="copy()"
      class="action-button">
      <mat-icon>content_copy</mat-icon>
    </button>
    @if(!text()){
      <button
        matIconButton
        matTooltip="Svuota"
        (click)="clear()"
        class="action-button">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
</mat-form-field>
