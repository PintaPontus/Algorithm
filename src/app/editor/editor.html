<div class="toolbar">
  <mat-form-field class="title-input">
    <mat-label>Titolo</mat-label>
    <input
      [(ngModel)]="title //noinspection ConstantReassignment"
      class="title-input-box"
      matInput
    />
  </mat-form-field>
  <mat-form-field class="description-input">
    <mat-label>Descrizione</mat-label>
    <input
      [(ngModel)]="description //noinspection ConstantReassignment"
      class="description-input-box"
      matInput
      placeholder="Inserisci una descrizione"
    />
  </mat-form-field>
  <div class="toolbar-actions">
    <a matButton="outlined" routerLink=""><mat-icon>arrow_top_left</mat-icon>Indietro</a>
    @if(isRunning()){
      <button matFab (click)="stopCode()" matTooltip="Ferma"><mat-icon>stop</mat-icon></button>
    } @else{
      <button matFab (click)="runCode()" matTooltip="Avvia"><mat-icon>play_arrow</mat-icon></button>
    }
    <button matFab (click)="export()" matTooltip="Esporta"><mat-icon>upload</mat-icon></button>
    <button matFab (click)="toggleOutput()" [matTooltip]="showOutput() ? 'Nascondi output' : 'Mostra output'"><mat-icon>{{ showOutput() ? 'code_off' : 'code' }}</mat-icon></button>
    <span class="script-edit-stat">Cursore: {{formattedCoordinates().x}}:{{formattedCoordinates().y}}</span>
    -
    <span class="script-edit-stat">{{keyPressed() || 'Nessun tasto premuto'}}</span>
  </div>
</div>
<div class="editor">
  <div #blocklyDiv id="blocklyDiv" class="blockly-canvas"></div>
  @if(showOutput()){
    <div class="output-panel">
      <h3>Codice generato:</h3>
      <pre class="generated-code"><code>{{ code() }}</code></pre>
      <mat-divider></mat-divider>
      <h3>Output console:</h3>
      <app-console class="output-console"></app-console>
    </div>
  }
</div>
